[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-agricole-uapi"
version = "0.3.0"
description = "Lightweight & Fast unofficial REST API for Credit Agricole"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "4strium", email = "romain@mellaza.eu" }]
keywords = ["credit-agricole", "api", "unofficial", "fastapi", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "playwright==1.62.0",
    "prompt_toolkit==3.0.53",
    "pydantic==2.13.4",
    "questionary==2.1.1",
    "rich==15.0.0",
    "uvicorn==0.52.1",
]

[project.urls]
Homepage = "https://github.com/4strium/credit-agricole-uapi"
Repository = "https://github.com/4strium/credit-agricole-uapi"

[project.scripts]
credit-agricole-uapi = "credit_agricole_uapi.cli:run"

[tool.setuptools.packages.find]
include = ["credit_agricole_uapi*"]

[tool.ruff.lint]
ignore = ["EXE001", "EXE002"]
